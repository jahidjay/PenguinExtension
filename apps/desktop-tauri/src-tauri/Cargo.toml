[package]
name = "penguin-desktop"
version = "0.1.0"
edition = "2021"

# Native desktop dependencies never become root workspace members.
[workspace]

[lib]
name = "penguin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Packaging scripts enable this explicitly; development keeps its local Vite URL.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
ue-core = { path = "../../../crates/ue-core" }
ue-style = { path = "../../../crates/ue-style" }
ue-ai = { path = "../../../crates/ue-ai" }
tempfile = "3"
same-file = "1.0.6"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
