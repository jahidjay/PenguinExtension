name: Verify PenguinCore
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo build --locked --release -p ue-lsp -p ue-mcp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Smoke-test the built language server
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python scripts/smoke_lsp.py target/release/penguin-lsp.exe
          else
            python scripts/smoke_lsp.py target/release/penguin-lsp
          fi
  clients:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [vscode-ext, desktop-tauri]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  vscode-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo build --locked --release -p ue-lsp
      - run: python scripts/stage-vscode-server.py
      - run: npm ci
        working-directory: apps/vscode-ext
      - run: npm run package
        working-directory: apps/vscode-ext
      - run: python scripts/verify_package.py vscode apps/vscode-ext/dist/penguin-vscode.vsix
      - run: python scripts/smoke_package.py vscode apps/vscode-ext/dist/penguin-vscode.vsix
  visual-studio:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: microsoft/setup-msbuild@v2
      - shell: pwsh
        run: ./scripts/build-vsix.ps1 -MSBuildPath (Get-Command MSBuild.exe).Source
      - run: python scripts/smoke_package.py visual-studio bin/Release/PenguinExtention.vsix
  desktop-native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux webview prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:portable -- -- --locked
